# Identificação e HTTP
quarkus.application.name=backlog-service
quarkus.http.port=8080
quarkus.http.test-port=0
%test.quarkus.http.port=0

# Banco H2 em memória e Hibernate ORM com Panache
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:backlog;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Seed de usuários fictícios habilitado somente em desenvolvimento e testes
lettergames.seed.habilitado=false
%dev.lettergames.seed.habilitado=true
%test.lettergames.seed.habilitado=true

# Parâmetros de negócio externalizados (alteráveis via variável de ambiente)
backlog.limite-jogando=${BACKLOG_LIMITE_JOGANDO:3}

# Integração síncrona REST Client com o catalogo-service
quarkus.rest-client.catalogo-api.url=${CATALOGO_URL:http://localhost:8081}
quarkus.rest-client.catalogo-api.connect-timeout=1000
quarkus.rest-client.catalogo-api.read-timeout=3000
catalogo.auth.usuario=${CATALOGO_AUTH_USUARIO:sistema-backlog}
catalogo.auth.senha=${CATALOGO_AUTH_SENHA:sistema123}

# SmallRye Fault Tolerance (parâmetros externalizados por método, conforme especificação MicroProfile FT)
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Timeout/value=2000
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Retry/maxRetries=2
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Retry/delay=200
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Retry/jitter=50
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/CircuitBreaker/requestVolumeThreshold=6
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/CircuitBreaker/failureRatio=0.5
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/CircuitBreaker/delay=10000
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/CircuitBreaker/successThreshold=2

br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Timeout/value=2000
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Retry/maxRetries=2
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Retry/delay=200
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Retry/jitter=50
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/CircuitBreaker/requestVolumeThreshold=6
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/CircuitBreaker/failureRatio=0.5
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/CircuitBreaker/delay=10000
br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/CircuitBreaker/successThreshold=2

# Ajustes de tempo em %test para execução determinística e rápida da suíte
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Timeout/value=250
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Retry/delay=20
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/Retry/jitter=10
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarJogoObrigatorio/CircuitBreaker/delay=5000

%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Timeout/value=250
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Retry/delay=20
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/Retry/jitter=10
%test.br.com.lettergames.backlog.integracao.CatalogoIntegracaoService/consultarDetalhesComSnapshot/CircuitBreaker/delay=5000

# Segurança HTTP Basic + JPA (sem autenticação proativa para manter /q/* públicos e 401 padronizado)
quarkus.http.auth.basic=true
quarkus.http.auth.proactive=false

# Observabilidade e OpenAPI
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logs
quarkus.log.level=INFO
quarkus.log.category."br.com.lettergames".level=INFO
