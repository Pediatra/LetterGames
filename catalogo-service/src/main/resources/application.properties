# Identificação e HTTP
quarkus.application.name=catalogo-service
quarkus.http.port=8081
quarkus.http.test-port=0
%test.quarkus.http.port=0

# Banco H2 em memória e Hibernate ORM com Panache
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Seed de dados fictícios habilitado somente em desenvolvimento e testes
lettergames.seed.habilitado=false
%dev.lettergames.seed.habilitado=true
%test.lettergames.seed.habilitado=true

# Parâmetros de negócio externalizados (alteráveis via variável de ambiente)
catalogo.duracao-maxima-horas=${CATALOGO_DURACAO_MAXIMA_HORAS:500}

# Segurança HTTP Basic + JPA (sem autenticação proativa para manter /q/* públicos e 401 padronizado)
quarkus.http.auth.basic=true
quarkus.http.auth.proactive=false

# Observabilidade e OpenAPI
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logs
quarkus.log.level=INFO
quarkus.log.category."br.com.lettergames".level=INFO
